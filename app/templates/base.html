<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}quote-box{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-wordmark" href="/">Quotes</a>
      <nav class="site-nav">
        {% if current_profile %}
          <span class="profile-badge">{{ current_profile.name }}</span>
          <form action="/profile/switch" method="post" class="switch-form">
            <button type="submit" class="switch-link">Switch</button>
          </form>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">quote-box</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
